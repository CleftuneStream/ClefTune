<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>ClefTune Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --accent: #f58247;
    --bg: #0e0e12;
    --bg-3: #1d1d25;
    --line: #2a2a35;
    --text: #ececf1;
    --text-2: #a4a4b3;
    --text-3: #6f6f80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1500px; height: 500px; background: var(--bg); overflow: hidden; }
  body {
    font-family: "Inter", "Noto Sans", "Cantarell", system-ui, sans-serif;
    color: var(--text);
    position: relative;
  }
  .glow {
    position: absolute; left: 260px; top: 250px; width: 900px; height: 900px;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(245,130,71,.34) 0%, rgba(245,130,71,.1) 30%, transparent 62%);
  }
  .staff { position: absolute; left: 0; right: 0; top: 130px; height: 240px; }
  .staff span {
    position: absolute; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(236,236,241,.06) 10%, rgba(236,236,241,.06) 90%, transparent);
  }
  .flare {
    position: absolute; left: 0; width: 900px; top: 199px; height: 3px;
    background: linear-gradient(90deg, transparent 0%, rgba(245,130,71,.9) 29%, transparent 100%);
    box-shadow: 0 0 20px rgba(245,130,71,.8);
  }
  .logo {
    position: absolute; left: 110px; top: 70px; width: 300px; height: 300px;
    border-radius: 66px;
    box-shadow: 0 30px 90px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06);
  }
  .content { position: absolute; left: 490px; top: 0; bottom: 0; right: 80px; display: flex; flex-direction: column; justify-content: center; }
  .eyebrow { font-size: 18px; font-weight: 600; letter-spacing: .28em; text-transform: uppercase; color: var(--accent); }
  h1 { font-size: 112px; font-weight: 900; letter-spacing: -.045em; line-height: 1; margin-top: 14px; }
  h1 em { font-style: normal; color: var(--accent); }
  .tag { font-size: 32px; font-weight: 600; letter-spacing: -.02em; margin-top: 14px; }
  .sub { font-size: 22px; color: var(--text-2); margin-top: 10px; }
  .chips { display: flex; gap: 10px; margin-top: 28px; }
  .chips span {
    font-size: 17px; font-weight: 600; padding: 9px 16px; border-radius: 10px;
    background: var(--bg-3); border: 1px solid var(--line);
  }
  .chips span.hot { background: var(--accent); border-color: var(--accent); color: #1a0c04; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="staff">
    <span style="top:0"></span><span style="top:60px"></span><span style="top:120px"></span><span style="top:180px"></span><span style="top:240px"></span>
  </div>
  <div class="flare"></div>
  <img class="logo" src="../assets/clef.png" alt="ClefTune">

  <div class="content">
    <div class="eyebrow">Free &middot; Open-source desktop music</div>
    <h1>Clef<em>Tune</em></h1>
    <div class="tag">Enjoy your Open-source Premiumness.</div>
    <div class="sub">Ad-free &middot; Gapless &middot; Synced lyrics &middot; Keeps playing when you close the window</div>
    <div class="chips"><span class="hot">Windows</span><span class="hot">macOS</span><span class="hot">Linux</span><span>GPL-3.0</span><span>Zero setup</span></div>
  </div>
</body>
</html>
